[package]
name = "agy-delegate-rs"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Read-only agy investigations through the Codex OS sandbox"
readme = "README.md"
repository = "https://github.com/JIAFALSEDREAM/agy-delegate-rs"
keywords = ["mcp", "sandbox", "cli", "agy"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "README.en.md", "INSTALL.md", "INSTALL.en.md", "LICENSE"]

[profile.release]
strip = true

[dependencies]
anyhow = "1"
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
dotenvy = "0.15"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
process-wrap = { version = "10", features = ["tokio1"] }
which = "8"
fs2 = "0.4"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tempfile = "3"
cap-std = "3.4"
cap-fs-ext = "3.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
